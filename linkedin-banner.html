<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RXD Cloud Consulting — LinkedIn banner source</title>
  <!--
    Source for linkedin-banner.png (1128x191), the LinkedIn company page cover image.

      "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
        --headless --disable-gpu --hide-scrollbars \
        --screenshot=linkedin-banner.png --window-size=1128,191 linkedin-banner.html

    Note: LinkedIn crops the banner differently on mobile and overlays the page logo
    on the lower left, so the left ~200px is deliberately kept empty of text.
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    .banner {
      width: 1128px;
      height: 191px;
      background: radial-gradient(circle at 82% 30%, #2a2270 0%, transparent 60%), #0f1420;
      color: #e8eaf2;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      /* Left padding leaves room for the logo LinkedIn overlays on the page. */
      padding: 0 56px 0 250px;
    }

    .banner::after {
      content: "";
      position: absolute;
      left: -60px;
      bottom: -160px;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      background: #5646e6;
      opacity: 0.18;
      filter: blur(30px);
    }

    .copy { position: relative; z-index: 1; }

    h1 {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.15;
      margin-bottom: 10px;
    }

    h1 em { font-style: normal; color: #a79dff; }

    p {
      font-size: 17px;
      color: #9aa1b5;
      font-weight: 500;
      letter-spacing: 0.01em;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="copy">
      <h1>Making Workday work with <em>everything around it</em></h1>
      <p>Workday Pro Certified · Studio · EIB · Core Connectors · Remote worldwide</p>
    </div>
  </div>
</body>
</html>
