<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RXD Cloud Consulting — share card source</title>
  <!--
    Source for og-image.png (1200x627), the card LinkedIn shows when the site is shared.
    Regenerate after any edit:

      "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
        --headless --disable-gpu --hide-scrollbars \
        --screenshot=og-image.png --window-size=1200,627 \
        --default-background-color=00000000 og-image.html

    The same layout at 1128x191 makes the LinkedIn company page banner — set
    .card { width: 1128px; height: 191px } and screenshot at that size.
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f1420;
    }

    .card {
      width: 1200px;
      height: 627px;
      background: radial-gradient(circle at 78% 18%, #2a2270 0%, transparent 55%), #0f1420;
      color: #e8eaf2;
      padding: 76px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    /* Soft accent wash bottom-left, mirrors the site's purple */
    .card::after {
      content: "";
      position: absolute;
      left: -140px;
      bottom: -220px;
      width: 560px;
      height: 560px;
      border-radius: 50%;
      background: #5646e6;
      opacity: 0.16;
      filter: blur(40px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 20px;
      position: relative;
      z-index: 1;
    }

    .mark {
      width: 76px;
      height: 76px;
      border-radius: 18px;
      background: #5646e6;
      color: #fff;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-name {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .brand-name span { color: #a79dff; }

    h1 {
      position: relative;
      z-index: 1;
      font-size: 62px;
      line-height: 1.12;
      font-weight: 800;
      letter-spacing: -0.02em;
      max-width: 15ch;
    }

    h1 em { font-style: normal; color: #a79dff; }

    .meta {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 24px;
      color: #9aa1b5;
      font-weight: 500;
    }

    .meta .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #5fd39b;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="card">

    <div class="brand">
      <div class="mark">RX</div>
      <div class="brand-name">RXD <span>Cloud Consulting</span></div>
    </div>

    <h1>Workday <em>integration</em> specialist</h1>

    <div class="meta">
      <span class="dot"></span>
      <span>Workday Pro Certified · 15+ years · Studio, EIB, Core Connectors</span>
    </div>

  </div>
</body>
</html>
